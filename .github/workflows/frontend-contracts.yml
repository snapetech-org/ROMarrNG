name: Desktop frontend contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore the LaunchBox proof
        run: dotnet restore scripts/launchbox_proof/launchbox_proof.csproj
      - name: Run frontend contracts with outbound networking blocked
        shell: pwsh
        run: ./scripts/test-frontend-contracts.ps1
