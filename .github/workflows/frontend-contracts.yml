# ng-runner-policy: hosted-compatible-v1
name: Desktop frontend contracts
run-name: ${{ format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'public') }}
on:
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [ci]
        required: true
      runner_pool:
        type: choice
        options: [public]
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore the LaunchBox proof
        run: dotnet restore scripts/launchbox_proof/launchbox_proof.csproj
      - name: Run frontend contracts with outbound networking blocked
        shell: pwsh
        run: ./scripts/test-frontend-contracts.ps1
