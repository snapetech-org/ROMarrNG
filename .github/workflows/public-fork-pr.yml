name: ROMarrNG public fork validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Run disposable fork validation
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/ROMarrNG' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    uses: snapetech-org/ROMarrNG/.github/workflows/fork-safe-validation.yml@75e3db919dfbffa916da0c97d752a5b1a013f919
