name: ROMarrNG public fork validation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-fork-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  validate:
    name: Run disposable fork validation
    if: >-
      github.event.pull_request.head.repo.fork == true &&
      github.event.pull_request.base.repo.full_name == 'snapetech-org/ROMarrNG' &&
      github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
    uses: snapetech-org/ROMarrNG/.github/workflows/fork-safe-validation.yml@749fd3aacacc669d6682b5a0771d0dc7f7665ab6
