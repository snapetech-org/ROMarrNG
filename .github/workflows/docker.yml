# ng-runner-policy: hosted-compatible-v1
name: docker

# Tests gate the image. A published `latest` that fails its own suite is worse
# than no published image, because somebody else is now running it.


run-name: ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}
on:
  push:
    branches: [main]
  pull_request:

  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [publish]
        required: true
      runner_pool:
        description: Compatible hosted runner pool
        type: choice
        options: [public]
        required: true
      release_tag:
        description: Existing v* release tag on the default branch
        type: string
        required: true

permissions:
  contents: read

# Keep main builds independent so a newer push cannot cancel an earlier
# candidate. Release tags share a queue so stable aliases stay in release order.
concurrency:
  group: docker-${{ inputs.release_tag != '' && 'stable-releases' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  # Repository-level switches had disabled the legacy scanner workflows.
  # Keep publication gates in this active workflow so push/PR cannot skip them.
  security-semgrep:
    name: Enforcing Semgrep scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e EIO_BACKEND=posix \
            -e HTTP_PROXY -e HTTPS_PROXY -e http_proxy -e https_proxy \
            -e NO_PROXY -e no_proxy \
            -e REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:1.184.0 \
            semgrep scan --error --config p/default --metrics=off --jobs 2 --timeout 30 --timeout-threshold 0 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review semgrep.sarif and the scan log."' semgrep.json

      - name: Retain scan report (semgrep)
        if: >-
          always() && hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-semgrep-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: warn
          retention-days: 14

  security-trivy:
    name: Enforcing Trivy scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the latest Trivy release
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # latest
        with:
          version: v0.76.2
          token: ${{ github.token }}

      - name: Scan applicable repository files
        run: ./scripts/security-scan-local.sh --trivy-only --ci

  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  release-notes:
    name: Release-note contract
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          python scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          python scripts/release_notes.py check-changelog-tags

  test:
    # Compatible Linux validation uses a hosted runner.
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        true
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false


      - name: Verify selected release tag is on the default branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --require-hashes -r requirements-test.lock

      - name: Run pytest suite
        run: |
          python_path="$(command -v python)"
          sudo unshare --net -- sh -c 'ip link set lo up; exec "$@"' sh "$python_path" -m pytest tests/ -q

  acquisition-proof:
    name: Packaged acquisition (${{ matrix.dockerfile }})
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        github.event_name != 'push' || github.ref == 'refs/heads/main' || inputs.release_tag != ''
      )
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.browser]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build native test image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t romarrng:acquisition-proof .
      - name: Prove sandboxed acquisition and SeerrNG delivery
        run: >-
          docker run --rm --network none -e PYTHONPATH=/app --entrypoint python
          -v "$PWD/scripts:/proof:ro" romarrng:acquisition-proof
          /proof/prove_upstream_acquisition.py

  image:
    needs: [test, release-notes, acquisition-proof, security-semgrep, security-trivy, dependency-review]
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        always() && needs.test.result == 'success' && needs.acquisition-proof.result == 'success' && needs.security-semgrep.result == 'success' && needs.security-trivy.result == 'success' && needs.dependency-review.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || inputs.release_tag != '') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Validate release tag
        if: inputs.release_tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' romarr/app.py | head -n 1)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match ROMarr.VERSION $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ "$TAG" != "$latest_tag" ]]; then
            echo "Release tag $TAG is older than the latest version tag $latest_tag."
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The suite gates the code; nothing gated the image. A broken entrypoint,
      # a dependency that failed to install, or a missing bsdtar would all pass
      # every test and publish anyway -- and the first person to find out would
      # be somebody who pulled it. So one leg is built, booted and questioned
      # before anything is pushed. Publication loads the saved validated
      # artifact for each native architecture without rebuilding it.
      - name: Build the native image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: romarr:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Boot the image and ask it whether it is alive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/romarr-config" "$RUNNER_TEMP/romarr-roms" \
                   "$RUNNER_TEMP/romarr-downloads"
          printf 'download fixture' > "$RUNNER_TEMP/romarr-downloads/source.rar"
          chmod 0775 "$RUNNER_TEMP/romarr-downloads/source.rar"
          before=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          docker run -d --name smoke --network none \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            --cap-add SETUID --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            -e PUID=1000 -e PGID=1000 -e UMASK=002 \
            -v "$RUNNER_TEMP/romarr-config:/config" \
            -v "$RUNNER_TEMP/romarr-roms:/roms" \
            -v "$RUNNER_TEMP/romarr-downloads:/downloads" \
            romarr:smoke
          for _ in $(seq 1 30); do
            docker exec smoke python -m romarr.healthcheck && break
            sleep 2
          done

          echo "--- liveness ---"
          docker exec smoke python -m romarr.healthcheck

          # No credential is set anywhere in this job, deliberately. An open
          # install is the failure mode that matters most for an image people
          # put on their LAN, and it is checkable without one.
          echo "--- the gate is on ---"
          code=$(docker exec smoke python -c "import http.client;c=http.client.HTTPConnection('127.0.0.1',6868);c.request('GET','/api/v1/system/status');print(c.getresponse().status)")
          test "$code" = "401" || { echo "status answered $code, not 401"; exit 1; }

          # bsdtar is not optional: without it every disc-platform import fails
          # on a format it cannot open, and nothing else in this job would
          # notice its absence.
          echo "--- the pieces that are easy to lose ---"
          docker exec smoke sh -c 'command -v bsdtar >/dev/null' \
            || { echo "bsdtar missing"; exit 1; }
          docker exec smoke sh -c 'command -v git >/dev/null' \
            || { echo "git missing; catalogue plugins cannot install"; exit 1; }
          docker exec smoke python -c "import requests, rom_hub; from rom_hub.sandbox import install; install()" \
            || { echo "a dependency did not install"; exit 1; }
          docker exec smoke python -c "from pathlib import Path; from rom_hub.catalog_sources import load_all; c=load_all(Path('/tmp/hub-smoke')); print(f'{len(c.entries)} bundled plugins'); assert c.entries" \
            || { echo "ROM Hub installed without its plugin catalogue"; exit 1; }

          echo "--- privileges were dropped ---"
          test "$(awk '/^Uid:/ {print $2}' /proc/$(docker inspect -f '{{.State.Pid}}' smoke)/status)" = "1000" \
            || { echo "service still runs as root"; exit 1; }
          docker logs smoke 2>&1 | grep -q "starting as 1000:1000 with umask 002" \
            || { echo "entrypoint did not drop to PUID:PGID"; exit 1; }

          echo "--- mounted downloads were not rewritten ---"
          after=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          test "$after" = "$before" \
            || { echo "source permissions changed: $before -> $after"; exit 1; }
          test "$(awk '/^Umask:/ {print $2}' /proc/$(docker inspect -f '{{.State.Pid}}' smoke)/status)" = "0002" \
            || { echo "server process did not inherit UMASK=002"; exit 1; }

          docker rm -f smoke

      - name: Save the exact validated image
        run: docker save romarr:smoke -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  image_publish:
    needs: [image]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish' && inputs.runner_pool == 'public' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG
            org.opencontainers.image.description=ROMarrNG adds a SeerrNG request and library contract to ROMarr
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=main,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=master,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=stable,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          path: ${{ runner.temp }}/validated
      - name: Push validated images and assemble their manifest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/validated/image-$arch/image.tar"
            ref="$IMAGE:validated-$BUILD_ID-$arch"
            docker tag romarr:smoke "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" {print $2; exit}')
            test -n "$digest"
            refs+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do [[ -z "$tag" ]] || tags+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          first=$(head -n 1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-image.spdx.json
          push-to-registry: true

  # Debian variant for the optional Playwright download client. Its aliases
  # follow the same release tag while remaining separate from the standard image.
  image-browser:
    name: Browser image validation
    needs: [image, release-notes]
    if: always() && needs.image.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build browser image for all supported platforms without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: romarrng:browser-validation
          cache-from: type=gha,scope=browser
          cache-to: type=gha,scope=browser,mode=max
          provenance: false

      - name: Prove the packaged browser edition with loopback fixtures
        run: |
          docker run --rm --network none --entrypoint python -e PYTHONPATH=/app -v "$PWD/scripts:/proof:ro" romarrng:browser-validation /proof/prove_upstream_acquisition.py
          docker run --rm --network none --cap-drop ALL --cap-add CHOWN --cap-add SETGID --cap-add SETUID --security-opt no-new-privileges romarrng:browser-validation python -c 'import os; from playwright.sync_api import sync_playwright; import rom_hub; assert os.geteuid() == 1000'
          docker save romarrng:browser-validation -o "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  image_browser_publish:
    needs: [image-browser, release-notes]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish' && inputs.runner_pool == 'public' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve this fork's image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: release
        if: inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=ROMarrNG (browser edition)
            org.opencontainers.image.description=ROMarrNG on Debian with the Playwright client for the Headless Browser download client
          tags: |
            type=raw,value=browser,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=main-browser,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=master-browser,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=latest-browser,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=stable-browser,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
            type=raw,value=${{ steps.release.outputs.version }}-browser,enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}}-browser
            type=semver,pattern={{major}}.{{minor}}-browser
            type=sha,format=short,suffix=-browser

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: browser-*
          path: ${{ runner.temp }}/validated
      - name: Push validated images and assemble their manifest
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            docker load -i "$RUNNER_TEMP/validated/browser-$arch/image.tar"
            ref="$IMAGE:validated-$BUILD_ID-$arch-browser"
            docker tag romarrng:browser-validation "$ref"
            docker push "$ref"
            digest=$(docker buildx imagetools inspect "$ref" | awk '$1 == "Digest:" {print $2; exit}')
            test -n "$digest"
            refs+=("$IMAGE@$digest")
          done
          tags=()
          while IFS= read -r tag; do [[ -z "$tag" ]] || tags+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          first=$(head -n 1 <<< "$TAGS")
          digest=$(docker buildx imagetools inspect "$first" | awk '$1 == "Digest:" {print $2; exit}')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate browser image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest browser image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest browser image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/romarrng-browser-image.spdx.json
          push-to-registry: true

  verify-stable-image-tags:
    name: Verify stable image aliases
    needs: [image_publish, image_browser_publish]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'publish' && inputs.runner_pool == 'public' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify all aliases match the latest stable release image
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == v* ]]; then
            python scripts/check_stable_image_tags.py --version "${RELEASE_TAG#v}"
          else
            python scripts/check_stable_image_tags.py
          fi

  release:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'publish' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        always() && github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && needs.image_publish.result == 'success' && needs.image_browser_publish.result == 'success' && needs.verify-stable-image-tags.result == 'success'
      )
    needs: [image_publish, image_browser_publish, verify-stable-image-tags]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog tag coverage
        run: python scripts/release_notes.py check-changelog-tags

      - name: Extract changelog entry
        env:
          TAG: ${{ inputs.release_tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { copying = 1; found = 1; print; next }
            copying && /^## \[/ { exit }
            copying { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^")"
          python scripts/release_notes.py assemble \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --changelog release-notes.md \
            --output release-notes.md \
            --require-prepared-changelog
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- Browser edition: \`${IMAGE}:${VERSION}-browser\` (AMD64/ARM64; Playwright client only)"
            echo "- [GitHub Container Registry](https://github.com/${GITHUB_REPOSITORY}/pkgs/container/romarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
          } >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ROMarrNG ${{ inputs.release_tag }}
          body_path: release-notes.md
          draft: false

      - name: Announce release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ inputs.release_tag }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          version="${TAG#v}"
          image_ref="${IMAGE}:${version}"
          python scripts/release_notes.py split-discord --input release-notes.md > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index++)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="ROMarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username "ROMarrNG Releases" \
              --arg title "$title" \
              --arg url "$RELEASE_URL" \
              --arg description "$description" \
              --arg image "$image_ref" \
              --arg workflow "$WORKFLOW_URL" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $workflow, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
