        with:
          python-version: "3.13"

      - name: Verify all aliases match the latest stable release image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python scripts/check_stable_image_tags.py --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/check_stable_image_tags.py
          fi

  release:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      needs.image_publish.result == 'success' &&
      needs.image_browser_publish.result == 'success' &&
      needs.verify-stable-image-tags.result == 'success'
    needs: [image_publish, image_browser_publish, verify-stable-image-tags]
    runs-on: ${{ ((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate changelog tag coverage
        run: python scripts/release_notes.py check-changelog-tags

      - name: Extract changelog entry
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { copying = 1; found = 1; print; next }
            copying && /^## \[/ { exit }
            copying { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_SHA}^")"
          python scripts/release_notes.py assemble \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --changelog release-notes.md \
            --output release-notes.md \
            --require-prepared-changelog
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- Browser edition: \`${IMAGE}:${VERSION}-browser\` (AMD64/ARM64; Playwright client only)"
            echo "- [GitHub Container Registry](https://github.com/${{ github.repository }}/pkgs/container/romarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
          } >> release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ROMarrNG ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false

      - name: Announce release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/romarrng
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }
          version="${TAG#v}"
          image_ref="${IMAGE}:${version}"
          python scripts/release_notes.py split-discord --input release-notes.md > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index++)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="ROMarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username "ROMarrNG Releases" \
              --arg title "$title" \
              --arg url "$RELEASE_URL" \
              --arg description "$description" \
              --arg image "$image_ref" \
              --arg workflow "$WORKFLOW_URL" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $workflow, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            response="$(curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done

  legacy-aliases:
    name: Sync Unraid GHCR compatibility aliases (${{ matrix.source_tag }})
    needs: [release]
    if: >-
      always() &&
      ((github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'v') &&
        needs.release.result == 'success') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
        github.ref == 'refs/heads/main' &&
        inputs.pr_number == '' && inputs.pr_sha == '' &&
        inputs.pr_base_sha == '' && inputs.target_run_id == ''))
    runs-on: ${{ ((github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && github.ref == 'refs/heads/main' && inputs.pr_number == '' && inputs.pr_sha == '' && inputs.pr_base_sha == '' && inputs.target_run_id == '')) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-legacy-aliases"]}}', github.run_id)) }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - source_image: ghcr.io/snapetech-org/romarrng
            target_image: ghcr.io/snapetech/romarrng
            source_tag: latest
            aliases: latest main master stable
          - source_image: ghcr.io/snapetech-org/romarrng
            target_image: ghcr.io/snapetech/romarrng
            source_tag: latest-browser
            aliases: browser main-browser master-browser latest-browser stable-browser
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the personal GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: snapetech
          password: ${{ secrets.GHCR_LEGACY_TOKEN }}

      - name: Align legacy aliases to the stable organization image
        shell: bash
        env:
          SOURCE_IMAGE: ${{ matrix.source_image }}
          TARGET_IMAGE: ${{ matrix.target_image }}
          SOURCE_TAG: ${{ matrix.source_tag }}
          ALIASES: ${{ matrix.aliases }}
        run: |
          set -euo pipefail
          digest_for() {
            local image="$1" output digest
            if ! output="$(docker buildx imagetools inspect "$image" 2>&1)"; then
              printf 'Could not inspect %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            digest="$(awk '$1 == "Digest:" { print $2; exit }' <<< "$output")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              printf 'No valid manifest digest in inspect output for %s:\n%s\n' "$image" "$output" >&2
              return 1
            fi
            printf '%s\n' "$digest"
          }

          source_ref="${SOURCE_IMAGE}:${SOURCE_TAG}"
          if ! expected_digest="$(digest_for "$source_ref")"; then
            echo "Could not resolve the published stable image $source_ref." >&2
            exit 1
          fi

          for alias in $ALIASES; do
            target_ref="${TARGET_IMAGE}:${alias}"
            if ! create_output="$(docker buildx imagetools create --tag "$target_ref" "$source_ref" 2>&1)"; then
              printf 'Could not copy %s to %s:\n%s\n' "$source_ref" "$target_ref" "$create_output" >&2
              exit 1
            fi
            if ! actual_digest="$(digest_for "$target_ref")"; then
              printf 'Could not verify destination image %s.\n' "$target_ref" >&2
              exit 1
            fi
            if [[ "$actual_digest" != "$expected_digest" ]]; then
              echo "$target_ref points to $actual_digest; expected $expected_digest." >&2
              exit 1
            fi
          done
          echo "Mirrored $source_ref to $TARGET_IMAGE ($expected_digest)." >> "$GITHUB_STEP_SUMMARY"

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private')
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.actor == 'snapetech' && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.ref == 'main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-packer","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch the requested action from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          expected='snapetech-org/ROMarrNG'
          repository=os.environ['GITHUB_REPOSITORY'];number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();base_sha=os.environ['PR_BASE_SHA'].lower();target=os.environ['TARGET_RUN_ID'];token=os.environ['GH_TOKEN']
          if repository.lower()!=expected.lower() or not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not re.fullmatch(r'[0-9a-f]{40}',base_sha) or not re.fullmatch(r'[1-9][0-9]*',target):raise SystemExit('invalid PR claim')
          payload=json.dumps({"ref": "main", "inputs": {"action": "ci", "runner_pool": "private", "pr_number": number, "pr_sha": sha, "pr_base_sha": base_sha, "target_run_id": target}}).encode()
          request=Request(
            'https://api.github.com/repos/snapetech-org/ROMarrNG/actions/workflows/docker.yml/dispatches',
            data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status!=204:raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [release-notes, test, security-review, acquisition-proof, image, image-browser]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.actor == 'github-actions[bot]' && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      pull-requests: read
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULTS: '{"release-notes":"${{ needs.release-notes.result }}","test":"${{ needs.test.result }}","security-review":"${{ needs.security-review.result }}","acquisition-proof":"${{ needs.acquisition-proof.result }}","image":"${{ needs.image.result }}","image-browser":"${{ needs.image-browser.result }}"}'
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();results=json.loads(os.environ['VALIDATION_RESULTS'])
          if not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not results:raise SystemExit('invalid PR check claim')
          repository=os.environ['REPOSITORY'];repository_id=int(os.environ['REPOSITORY_ID'])
          if repository.lower()!='snapetech-org/romarrng':raise SystemExit('unexpected repository')
          pr_request=Request(f'https://api.github.com/repos/{repository}/pulls/{number}',headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28'})
          with urlopen(pr_request,timeout=20) as response:current_pr=json.load(response)
          head_repo=current_pr.get('head',{}).get('repo') or {}
          if current_pr.get('state')!='open' or current_pr.get('user',{}).get('login')!='snapetech' or current_pr.get('base',{}).get('ref')!='main' or current_pr.get('head',{}).get('sha','').lower()!=sha or (head_repo.get('full_name') or '').lower()!=repository.lower() or head_repo.get('id')!=repository_id:raise SystemExit('PR head is no longer the dispatched head')
          conclusion='success' if all(v=='success' for v in results.values()) else 'failure'
          summary='Main-pinned, no-secret owner PR validation:\n'+'\n'.join(f'- {n}: {v}' for n,v in results.items())
          run_id=os.environ['VALIDATION_RUN_ID']
          payload=json.dumps({"name": "ROMarrNG owner PR validation", "head_sha": sha, "external_id": run_id, "status": "completed", "conclusion": conclusion, "details_url": "https://github.com/snapetech-org/ROMarrNG/actions/runs/" + run_id, "output": {"title": "Owner PR validation " + conclusion, "summary": summary}}).encode()
          request=Request('https://api.github.com/repos/snapetech-org/ROMarrNG/check-runs',data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status not in {201,202}:raise SystemExit(f'check HTTP {response.status}')
          PY
