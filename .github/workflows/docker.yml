# ng-runner-policy: private-jit-only-v1
name: docker
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action, inputs.runner_pool)) ||
      (github.event_name == 'pull_request_target' && 'owner-pr-label-event') || github.workflow }}

# Tests gate the image. A published `latest` that fails its own suite is worse
# than no published image, because somebody else is now running it.

on:
  push:
    tags: ["v*"]
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: Requested action
        required: true
        default: ci
        type: choice
        options:
          - ci
      runner_pool:
        description: Private runner pool
        required: true
        default: private
        type: choice
        options:
          - private

      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      pr_base_sha:
        description: Exact owner PR base SHA for dependency review
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
permissions:
  contents: read

# Keep main builds independent so a newer push cannot cancel an earlier
# candidate. Release tags share a queue so stable aliases stay in release order.
concurrency:
  group: docker-${{ startsWith(github.ref, 'refs/tags/v') && 'stable-releases' || github.run_id }}
  queue: max
  cancel-in-progress: false

jobs:
  release-notes:
    name: Release-note contract
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
       inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name != 'pull_request_target' &&
       (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
        github.event.pull_request.user.login != 'snapetech' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.head.repo.id != github.repository_id ||
        github.event.pull_request.base.ref != 'main') &&
       (github.event_name != 'workflow_dispatch' ||
        (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == '')) &&
       ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && (((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-release-notes"]}}', github.run_id)))) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Resolve current trusted PR metadata
        id: owner_pr
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['REPOSITORY']
          number = os.environ['PR_NUMBER']
          expected = os.environ['PR_SHA'].lower()
          if repo.lower() != 'snapetech-org/romarrng' or not re.fullmatch(r'[1-9][0-9]*', number) or not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('invalid trusted PR claim')
          request = Request(
              f'https://api.github.com/repos/{repo}/pulls/{number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urlopen(request, timeout=20) as response:
              pr = json.load(response)
          base = pr.get('base') or {}
          head = pr.get('head') or {}
          base_repo = base.get('repo') or {}
          head_repo = head.get('repo') or {}
          sha = (head.get('sha') or '').lower()
          if (
              pr.get('state') != 'open'
              or ((pr.get('user') or {}).get('login') or '').lower() != 'snapetech'
              or base.get('ref') != 'main'
              or sha != expected
              or (base_repo.get('full_name') or '').lower() != repo.lower()
              or (head_repo.get('full_name') or '').lower() != repo.lower()
              or base_repo.get('id') != head_repo.get('id')
          ):
              raise SystemExit('PR changed or is not trusted')
          base_sha = (base.get('sha') or '').lower()
          if not re.fullmatch(r'[0-9a-f]{40}', base_sha):
              raise SystemExit('invalid PR base')
          body = Path(os.environ['RUNNER_TEMP']) / 'owner-pr-body.md'
          body.write_text(pr.get('body') or '', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'base_sha={base_sha}\n')
              output.write(f'body_file={body}\n')
          PY

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ inputs.pr_number != '' && steps.owner_pr.outputs.base_sha || (github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before) }}
          HEAD_SHA: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || github.event.head_commit.message || '' }}
          BODY_FILE: ${{ steps.owner_pr.outputs.body_file || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${BODY_FILE:-}" ]]; then
            body_file="$BODY_FILE"
          else
            body_file="$RUNNER_TEMP/pr-body.md"
            printf '%s' "$PR_BODY" > "$body_file"
          fi
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          python scripts/release_notes.py check \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          python scripts/release_notes.py check-changelog-tags

  test:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    # Only trusted same-repository owner PRs reach this validation after the
    # metadata-only pull_request_target dispatcher starts a main-pinned JIT run.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && (((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest PyYAML

      - name: Run pytest suite
        run: python -m pytest tests/ -q

  security-review:
    name: Security review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' &&
      inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-security-review"]}}', github.run_id)) }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      HTTP_PROXY: http://10.0.2.100:3128
      HTTPS_PROXY: http://10.0.2.100:3128
      http_proxy: http://10.0.2.100:3128
      https_proxy: http://10.0.2.100:3128
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Check out the exact owner PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha }}
          persist-credentials: false

      - name: Verify the isolated Docker daemon
        run: docker info

      - name: Scan with Semgrep CE
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e HTTP_PROXY -e HTTPS_PROXY -e http_proxy -e https_proxy \
            -e NO_PROXY -e no_proxy \
            -e REQUESTS_CA_BUNDLE -e CURL_CA_BUNDLE -e SSL_CERT_FILE \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report Semgrep finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: jq -r '"Semgrep CE reported \(.results | length) finding(s). Review the scan log."' semgrep.json

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.2.5
        with:
          version: latest
          token: ${{ github.token }}

      - name: Scan source, dependencies, and configuration with Trivy
        run: ./scripts/security-scan-local.sh --trivy-only --ci

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.pr_base_sha }}
          head-ref: ${{ inputs.pr_sha }}
          fail-on-severity: moderate

  acquisition-proof:
    name: Packaged acquisition (${{ matrix.dockerfile }})
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((matrix.dockerfile == 'Dockerfile' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-acquisition-dockerfile"]}}', github.run_id))) || (matrix.dockerfile == 'Dockerfile.browser' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-acquisition-browser"]}}', github.run_id)))) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && (((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-{1}-acquisition-proof"]}}', github.run_id, strategy.job-index)))) }}
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.browser]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Build native test image
        run: docker build --build-arg TARGETARCH=amd64 -f "${{ matrix.dockerfile }}" -t romarrng:acquisition-proof .
      - name: Prove sandboxed acquisition and SeerrNG delivery
        run: >-
          docker run --rm -e PYTHONPATH=/app --entrypoint python
          -v "$PWD/scripts:/proof:ro" romarrng:acquisition-proof
          /proof/prove_upstream_acquisition.py

  image:
    needs: [test, release-notes, acquisition-proof]
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main') && (always() && needs.test.result == 'success' && needs.acquisition-proof.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'))) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) && (always() && needs.test.result == 'success' && needs.acquisition-proof.result == 'success' && (needs.release-notes.result == 'success' || needs.release-notes.result == 'skipped') && (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-image"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && (((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-romarrng","ng-main-run-{0}","gha-{0}-image"]}}', github.run_id)))) }}
    env:
      BUILDKIT_EGRESS_PROXY: ${{ ((github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.action == 'ci' && inputs.runner_pool == 'private' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.pr_base_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') || ((contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))))) && 'http://10.0.2.100:3128' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate stable image tag policy
        run: python scripts/check_image_alias_policy.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION = "\([^"]*\)"/\1/p' romarr/app.py | head -n 1)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match ROMarr.VERSION $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ "$TAG" != "$latest_tag" ]]; then
            echo "Release tag $TAG is older than the latest version tag $latest_tag."
            exit 1
          fi

      # armv7 has no musl wheel for charset-normalizer, so that leg compiles
      # under emulation. It is the slow one; the others are native-speed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The isolated BuildKit daemon needs the runner's trust roots too.
          buildkitd-config-inline: |
            [registry."docker.io"]
              ca = ["/etc/ssl/certs/ca-certificates.crt"]
          driver-opts: |
            env.HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.SSL_CERT_FILE=/etc/buildkit/certs/docker.io/ca-certificates.crt

      # The suite gates the code; nothing gated the image. A broken entrypoint,
      # a dependency that failed to install, or a missing bsdtar would all pass
      # every test and publish anyway -- and the first person to find out would
      # be somebody who pulled it. So one leg is built, booted and questioned
      # before anything is pushed. The multi-arch build below reuses this
      # build's cache, so the cost is close to nothing.
      - name: Build the amd64 leg for a smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: romarr:smoke
          build-args: |
            HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: ${{ inputs.pr_number == '' && 'type=gha' || '' }}
          cache-to: ${{ inputs.pr_number == '' && 'type=gha,mode=max' || '' }}
          provenance: false

      - name: Boot the image and ask it whether it is alive
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/romarr-config" "$RUNNER_TEMP/romarr-roms" \
                   "$RUNNER_TEMP/romarr-downloads"
          printf 'download fixture' > "$RUNNER_TEMP/romarr-downloads/source.rar"
          chmod 0775 "$RUNNER_TEMP/romarr-downloads/source.rar"
          before=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          docker run -d --name smoke -p 6868:6868 \
            --read-only --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            --cap-add SETUID --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m \
            -e PUID=1000 -e PGID=1000 -e UMASK=002 \
            -v "$RUNNER_TEMP/romarr-config:/config" \
            -v "$RUNNER_TEMP/romarr-roms:/roms" \
            -v "$RUNNER_TEMP/romarr-downloads:/downloads" \
            romarr:smoke
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:6868/api/health && break
            sleep 2
          done

          echo "--- liveness ---"
          curl -fsS http://127.0.0.1:6868/api/health

          # No credential is set anywhere in this job, deliberately. An open
          # install is the failure mode that matters most for an image people
          # put on their LAN, and it is checkable without one.
          echo "--- the gate is on ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 http://127.0.0.1:6868/api/v1/system/status)
          test "$code" = "401" || { echo "status answered $code, not 401"; exit 1; }

          # bsdtar is not optional: without it every disc-platform import fails
          # on a format it cannot open, and nothing else in this job would
          # notice its absence.
          echo "--- the pieces that are easy to lose ---"
          docker exec smoke sh -c 'command -v bsdtar >/dev/null' \
            || { echo "bsdtar missing"; exit 1; }
          docker exec smoke sh -c 'command -v git >/dev/null' \
            || { echo "git missing; catalogue plugins cannot install"; exit 1; }
          docker exec smoke python -c "import requests, rom_hub; from rom_hub.sandbox import install; install()" \
            || { echo "a dependency did not install"; exit 1; }
          docker exec smoke python -c "from pathlib import Path; from rom_hub.catalog_sources import load_all; c=load_all(Path('/tmp/hub-smoke')); print(f'{len(c.entries)} bundled plugins'); assert c.entries" \
            || { echo "ROM Hub installed without its plugin catalogue"; exit 1; }
          docker exec smoke sh -c 'ROM_HUB_HOME=/tmp/hub-install rom-hub plugin install archive-org' \
            || { echo "bundled Archive.org plugin did not install"; exit 1; }

          echo "--- privileges were dropped ---"
          docker logs smoke 2>&1 | grep -q "starting as 1000:1000 with umask 002" \
            || { echo "entrypoint did not drop to PUID:PGID"; exit 1; }

          echo "--- mounted downloads were not rewritten ---"
          after=$(stat -c '%u:%g:%a' "$RUNNER_TEMP/romarr-downloads/source.rar")
          test "$after" = "$before" \
            || { echo "source permissions changed: $before -> $after"; exit 1; }
          test "$(awk '/^Umask:/ {print $2}' /proc/$(docker inspect -f '{{.State.Pid}}' smoke)/status)" = "0002" \
            || { echo "server process did not inherit UMASK=002"; exit 1; }

          docker rm -f smoke

