            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: ${{ inputs.pr_number == '' && 'type=gha' || '' }}
          cache-to: ${{ inputs.pr_number == '' && 'type=gha,mode=max' || '' }}
          provenance: false

